openapi: 3.0.3
info:
  title: UniLink — API del módulo Plataforma
  version: 0.1.0
  description: 'Categorías, palabras prohibidas y registro de auditoría.


    Esqueleto acordado antes de programar (ADR-006): rutas, quién puede usarlas, caso de uso y spec de origen. Los esquemas
    de las peticiones y respuestas se completan cuando el spec pasa a Aprobado. Convenciones en contracts/api/README.md.'
