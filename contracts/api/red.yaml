openapi: 3.0.3
info:
  title: UniLink — API del módulo Red
  version: 0.1.0
  description: 'Conexiones, onboarding y sugerencias, búsqueda y vista del perfil de otro usuario.


    Esqueleto acordado antes de programar (ADR-006): rutas, quién puede usarlas, caso de uso y spec de origen. Los esquemas
    de las peticiones y respuestas se completan cuando el spec pasa a Aprobado. Convenciones en contracts/api/README.md.'
servers:
- url: /api/v1/red
security:
- sesion: []
paths:
  /solicitudes:
    post:
      summary: Enviar una solicitud de conexión
      description: 'Quién: Solicitante. Detalle en FS-RED-01.'
      operationId: postSolicitudes
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-06
      x-spec: FS-RED-01
      responses:
        '201':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      summary: Solicitudes recibidas y enviadas
      description: 'Quién: Usuario. Detalle en FS-RED-01.'
      operationId: getSolicitudes
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
  /solicitudes/{solicitud_id}/aceptacion:
    post:
      summary: Aceptar una solicitud
      description: 'Quién: Destinatario. Detalle en FS-RED-01.'
      operationId: postSolicitudesSolicitud_idAceptacion
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: string
  /solicitudes/{solicitud_id}/rechazo:
    post:
      summary: Rechazar una solicitud
      description: 'Quién: Destinatario. Detalle en FS-RED-01.'
      operationId: postSolicitudesSolicitud_idRechazo
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '204':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: string
  /solicitudes/{solicitud_id}:
    delete:
      summary: Cancelar una solicitud enviada
      description: 'Quién: Solicitante. Detalle en FS-RED-01.'
      operationId: deleteSolicitudesSolicitud_id
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-06
      x-spec: FS-RED-01
      responses:
        '204':
          description: Operación exitosa.
        '400':
