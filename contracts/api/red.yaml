    post:
      summary: Enviar las solicitudes elegidas u omitir el onboarding
      description: 'Quién: Usuario. Detalle en FS-RED-02.'
      operationId: postOnboarding
      tags:
      - FS-RED-02
      x-casos-de-uso:
      - CU-13
      x-spec: FS-RED-02
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /sugerencias:
    get:
      summary: Personas que podrían interesarte
      description: 'Quién: Usuario. Detalle en FS-RED-02.'
      operationId: getSugerencias
      tags:
      - FS-RED-02
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-02
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
  /busqueda:
    get:
      summary: Buscar perfiles
      description: 'Quién: Observador. Detalle en FS-RED-03.'
      operationId: getBusqueda
      tags:
      - FS-RED-03
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-03
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
  /perfiles/{usuario_id}:
    get:
      summary: Ver el perfil de otro usuario con su privacidad aplicada
      description: 'Quién: Observador. Detalle en FS-RED-03.'
      operationId: getPerfilesUsuario_id
      tags:
      - FS-RED-03
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-03
      responses:
        '200':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: unilink_sesion
      description: Cookie HttpOnly, Secure y SameSite (RNF-SEG-03). Las escrituras exigen además la cabecera X-CSRF-Token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Evita duplicar una creación reenviada (RNF-CON-03).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión (ETag) que el usuario editó; si cambió, 409 (RNF-CON-02).
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      - correlation_id
      properties:
        error:
          type: string
          description: Código estable, por ejemplo CUPO_COMPLETO.
        message:
          type: string
          description: Texto MSG-NN del spec, listo para mostrar.
        correlation_id:
          type: string
          description: Identificador de la petición (RNF-OBS-01).
  responses:
    Validacion:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Sin sesión o sesión vencida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: El actor no tiene permiso según "Quién es quién" (RNF-SEG-04).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe o el usuario no puede verlo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Estado cambiado, versión desactualizada o regla de negocio incumplida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LimiteDeUso:
      description: Límite de uso superado (RNF-SEG-07).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos para reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
