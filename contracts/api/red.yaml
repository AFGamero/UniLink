openapi: 3.1.0
info:
  title: UniLink — API del módulo Red
  version: 0.2.0
  description: 'Conexiones, onboarding y sugerencias, búsqueda y vista del perfil de otro usuario.


    Versión 0.2.0 (2026-10-27): todas las operaciones tienen esquemas de petición y respuesta y coinciden con FS-RED-01, FS-RED-02
    y FS-RED-03. Convenciones en contracts/api/README.md.'
servers:
- url: /api/v1/red
security:
- sesion: []
paths:
  /solicitudes:
    post:
      summary: Enviar una solicitud de conexión
      description: 'Quién: Solicitante. Detalle en FS-RED-01.'
      operationId: postSolicitudes
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-06
      x-spec: FS-RED-01
      responses:
        '201':
          description: Solicitud creada. Si ya existía una solicitud cruzada, llega con estado Aceptada y se crea la conexión
            (RN-02).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitud'
      x-esquemas: completos
    get:
      summary: Solicitudes recibidas y enviadas
      description: 'Quién: Usuario. Detalle en FS-RED-01.'
      operationId: getSolicitudes
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSolicitudes'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: tipo
        in: query
        required: true
        description: 'Las enviadas incluyen solo las pendientes: el solicitante no ve los rechazos (RN-06).'
        schema:
          type: string
          enum:
          - recibidas
          - enviadas
      - &id001
        name: pagina
        in: query
        required: false
        description: Número de página, desde 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      x-esquemas: completos
  /solicitudes/{solicitud_id}/aceptacion:
    post:
      summary: Aceptar una solicitud
      description: 'Quién: Destinatario. Detalle en FS-RED-01.'
      operationId: postSolicitudesSolicitud_idAceptacion
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conexion'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-esquemas: completos
  /solicitudes/{solicitud_id}/rechazo:
    post:
      summary: Rechazar una solicitud
      description: 'Quién: Destinatario. Detalle en FS-RED-01.'
      operationId: postSolicitudesSolicitud_idRechazo
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '204':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-esquemas: completos (sin cuerpo)
  /solicitudes/{solicitud_id}:
    delete:
      summary: Cancelar una solicitud enviada
      description: 'Quién: Solicitante. Detalle en FS-RED-01.'
      operationId: deleteSolicitudesSolicitud_id
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-06
      x-spec: FS-RED-01
      responses:
        '204':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-esquemas: completos (sin cuerpo)
  /conexiones:
    get:
      summary: Mis conexiones
      description: 'Quién: Usuario. Detalle en FS-RED-01.'
      operationId: getConexiones
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaConexiones'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: texto
        in: query
        required: false
        description: Busca por nombre dentro de las propias conexiones (RF-07).
        schema:
          type: string
          maxLength: 100
      - *id001
      x-esquemas: completos
  /conexiones/{usuario_id}:
    delete:
      summary: Eliminar una conexión
      description: 'Quién: Conexión. Detalle en FS-RED-01.'
      operationId: deleteConexionesUsuario_id
      tags:
      - FS-RED-01
      x-casos-de-uso:
      - CU-07
      x-spec: FS-RED-01
      responses:
        '204':
          description: Operación exitosa.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-esquemas: completos (sin cuerpo)
  /onboarding:
    get:
      summary: Sugerencias del onboarding
      description: 'Quién: Usuario. Detalle en FS-RED-02.'
      operationId: getOnboarding
      tags:
      - FS-RED-02
      x-casos-de-uso:
      - CU-13
      x-spec: FS-RED-02
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugerencias'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      x-esquemas: completos
    post:
      summary: Enviar las solicitudes elegidas u omitir el onboarding
      description: 'Quién: Usuario. Detalle en FS-RED-02.'
      operationId: postOnboarding
      tags:
      - FS-RED-02
      x-casos-de-uso:
      - CU-13
      x-spec: FS-RED-02
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoOnboarding'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccionOnboarding'
      x-esquemas: completos
  /sugerencias:
    get:
      summary: Personas que podrían interesarte
      description: 'Quién: Usuario. Detalle en FS-RED-02.'
      operationId: getSugerencias
      tags:
      - FS-RED-02
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-02
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugerencias'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      x-esquemas: completos
  /busqueda:
    get:
      summary: Buscar perfiles
      description: 'Quién: Observador. Detalle en FS-RED-03.'
      operationId: getBusqueda
      tags:
      - FS-RED-03
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-03
      responses:
        '200':
          description: Resultados en páginas de 20 (RN-06). Sin texto ni filtros devuelve "Personas que podrían interesarte"
            (RN-07).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusqueda'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: texto
        in: query
        required: false
        description: Mínimo 2 caracteres; busca en nombre, titular, habilidades y "Puede aportar" sin distinguir mayúsculas
          ni tildes y tolera errores de escritura menores (RN-01, ADR-008). Más de 100 caracteres se recorta.
        schema:
          type: string
          minLength: 2
      - name: tipo_usuario
        in: query
        required: false
        description: Filtro O dentro del mismo filtro e Y entre filtros (RN-02).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TipoUsuario'
      - name: facultad
        in: query
        required: false
        description: Identificadores de facultad del catálogo oficial.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: unidad_academica
        in: query
        required: false
        description: Programas, departamentos o dependencias del catálogo oficial.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: habilidades
        in: query
        required: false
        description: Identificadores de etiquetas.
        style: form
        explode: true
        schema:
          type: array
          items: &id002
            type: string
            format: uuid
      - name: intereses
        in: query
        required: false
        description: Identificadores de etiquetas.
        style: form
        explode: true
        schema:
          type: array
          items: *id002
      - name: puede_aportar
        in: query
        required: false
        description: Identificadores de etiquetas.
        style: form
        explode: true
        schema:
          type: array
          items: *id002
      - name: necesita
        in: query
        required: false
        description: Identificadores de etiquetas.
        style: form
        explode: true
        schema:
          type: array
          items: *id002
      - name: monitor
        in: query
        required: false
        description: true = solo monitores académicos (RN-09).
        schema:
          type: boolean
      - name: area_monitor
        in: query
        required: false
        description: Área del monitor (RN-09).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: especializacion_monitor
        in: query
        required: false
        description: Especialización del monitor (RN-09).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - *id001
      x-esquemas: completos
  /perfiles/{usuario_id}:
    get:
      summary: Ver el perfil de otro usuario con su privacidad aplicada
      description: 'Quién: Observador. Detalle en FS-RED-03.'
      operationId: getPerfilesUsuario_id
      tags:
      - FS-RED-03
      x-casos-de-uso:
      - CU-05
      x-spec: FS-RED-03
      responses:
        '200':
          description: Operación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPerfil'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteDeUso'
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-esquemas: completos
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: unilink_sesion
      description: Cookie HttpOnly, Secure y SameSite (RNF-SEG-03). Las escrituras exigen además la cabecera X-CSRF-Token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Evita duplicar una creación reenviada (RNF-CON-03).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión (ETag) que el usuario editó; si cambió, 409 (RNF-CON-02).
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      - correlation_id
      properties:
        error:
          type: string
          description: Código estable, por ejemplo CUPO_COMPLETO.
        message:
          type: string
          description: Texto MSG-NN del spec, listo para mostrar.
        correlation_id:
          type: string
          description: Identificador de la petición (RNF-OBS-01).
    Pagina:
      type: object
      required:
      - pagina
      - tamano
      - total
      properties:
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total de elementos que cumplen el filtro.
    Etiqueta:
      type: object
      required:
      - id
      - nombre
      description: Etiqueta del catálogo predefinido (FS-USR-06 RN-03).
      properties:
        id: *id002
        nombre:
          type: string
    UnidadAcademica:
      type: object
      required:
      - tipo
      - id
      - nombre
      description: Programa (estudiante), departamento con su facultad (profesor) o dependencia (personal administrativo).
        FS-USR-01 RN-10.
      properties:
        tipo:
          type: string
          enum:
          - programa
          - departamento
          - dependencia
        id:
          type: string
        nombre:
          type: string
        facultad_id:
          type:
          - string
          - 'null'
        facultad_nombre:
          type:
          - string
          - 'null'
    TipoUsuario:
      type: string
      enum:
      - Estudiante
      - Profesor
      - Personal administrativo
    Monitor:
      type:
      - object
      - 'null'
      description: Estado de monitor académico (FS-USR-06 RN-13). Solo lo escribe la sincronización institucional (ADR-014);
        es null si no es monitor o si el observador no puede verlo (FS-RED-03 RN-04, P-67).
      required:
      - area
      - especializacion
      properties:
        area:
          type: string
        especializacion:
          type: string
      readOnly: true
    TarjetaPerfil:
      type: object
      required:
      - usuario_id
      - nivel
      - nombre
      - unidad_academica
      description: Resumen de un perfil con la privacidad aplicada (FS-RED-03 RF-03 y RN-04). Con nivel BASICO solo se envían
        nombre, foto y unidad académica; titular, puede_aportar y monitor llegan vacíos o null (SEC-07).
      properties:
        usuario_id: *id002
        nivel:
          type: string
          enum:
          - COMPLETO
          - BASICO
        nombre:
          type: string
        foto_url:
          type:
          - string
          - 'null'
          format: uri
        unidad_academica:
          $ref: '#/components/schemas/UnidadAcademica'
        titular:
          type:
          - string
          - 'null'
        puede_aportar:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Etiqueta'
          description: Hasta 3 etiquetas; vacío con nivel BASICO.
        motivo_complementariedad:
          type:
          - string
          - 'null'
          description: Por ejemplo, "Puede aportar Diseño gráfico, que tú necesitas" (RF-04).
        monitor:
          $ref: '#/components/schemas/Monitor'
    EstadoSolicitud:
      type: string
      enum:
      - Pendiente
      - Aceptada
      - Rechazada
      - Cancelada
      description: Las solicitudes no vencen (FS-RED-01 RN-08).
    Solicitud:
      type: object
      required:
      - id
      - solicitante
      - destinatario
      - estado
      - enviada_en
      properties:
        id: *id002
        solicitante:
          $ref: '#/components/schemas/TarjetaPerfil'
        destinatario:
          $ref: '#/components/schemas/TarjetaPerfil'
        mensaje:
          type:
          - string
          - 'null'
          maxLength: 300
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        enviada_en: &id003
          type: string
          format: date-time
        respondida_en:
          type:
          - string
          - 'null'
          format: date-time
    NuevaSolicitud:
      type: object
      required:
      - destinatario_id
      additionalProperties: false
      properties:
        destinatario_id: *id002
        mensaje:
          type:
          - string
          - 'null'
          maxLength: 300
    ListaSolicitudes:
      type: object
      required:
      - elementos
      - pagina
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Solicitud'
        pagina:
          $ref: '#/components/schemas/Pagina'
    Conexion:
      type: object
      required:
      - usuario
      - desde
      properties:
        usuario:
          $ref: '#/components/schemas/TarjetaPerfil'
        desde: *id003
    ListaConexiones:
      type: object
      required:
      - elementos
      - pagina
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Conexion'
        pagina:
          $ref: '#/components/schemas/Pagina'
    Sugerencia:
      type: object
      required:
      - perfil
      - puntaje
      - motivo
      - complementaria
      description: Candidato con su puntaje y motivo principal (FS-RED-02 RN-03 y RN-06).
      properties:
        perfil:
          $ref: '#/components/schemas/TarjetaPerfil'
        puntaje:
          type: integer
          minimum: 1
        motivo:
          type: string
        complementaria:
          type: boolean
          description: Muestra la insignia de RF-06.
    ListaSugerencias:
      type: object
      required:
      - elementos
      properties:
        elementos:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Sugerencia'
    AccionOnboarding:
      type: object
      required:
      - accion
      additionalProperties: false
      properties:
        accion:
          type: string
          enum:
          - enviar
          - omitir
        destinatarios:
          type: array
          maxItems: 20
          uniqueItems: true
          items: *id002
          description: Obligatorio y no vacío si accion es "enviar"; nunca preseleccionados (RN-07).
    ResultadoOnboarding:
      type: object
      required:
      - enviadas
      - omitidas
      properties:
        enviadas:
          type: integer
          minimum: 0
        omitidas:
          type: array
          items: *id002
          description: Candidatos que dejaron de estar disponibles (RN-11, MSG-05).
    ResultadoBusqueda:
      type: object
      required:
      - elementos
      - pagina
      properties:
        elementos:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TarjetaPerfil'
        pagina:
          $ref: '#/components/schemas/Pagina'
    Relacion:
      type: string
      enum:
      - sin_relacion
      - solicitud_enviada
      - solicitud_recibida
      - conectados
      - rechazada_reciente
      description: Define el botón del perfil (FS-RED-01, sección 7).
    EntradaExperiencia:
      type: object
      required:
      - cargo
      - organizacion
      - fecha_inicio
      properties:
        cargo:
          type: string
        organizacion:
          type: string
        fecha_inicio: &id004
          type: string
          format: date
        fecha_fin:
          type:
          - string
          - 'null'
          format: date
          description: null = actual.
        descripcion:
          type:
          - string
          - 'null'
          maxLength: 500
    EntradaProyecto:
      type: object
      required:
      - nombre
      properties:
        nombre:
          type: string
        descripcion:
          type:
          - string
          - 'null'
          maxLength: 500
        enlace:
          type:
          - string
          - 'null'
          format: uri
    EntradaLogro:
      type: object
      required:
      - titulo
      - fecha
      properties:
        titulo:
          type: string
        fecha: *id004
        descripcion:
          type:
          - string
          - 'null'
          maxLength: 300
    VistaPerfil:
      type: object
      required:
      - usuario_id
      - nivel
      - nombre
      - unidad_academica
      - tipo_usuario
      - tipo_verificado
      - relacion
      - numero_conexiones
      description: Perfil de otro usuario con su privacidad aplicada (FS-RED-03 RN-08). Con nivel BASICO, los campos de COMPLETO
        llegan null o vacíos (SEC-07). Un perfil retirado por moderación oculta titular, biografía y trayectoria (FS-USR-06
        RN-11).
      properties:
        usuario_id: *id002
        nivel:
          type: string
          enum:
          - COMPLETO
          - BASICO
        nombre:
          type: string
        foto_url:
          type:
          - string
          - 'null'
          format: uri
        unidad_academica:
          $ref: '#/components/schemas/UnidadAcademica'
        tipo_usuario:
          $ref: '#/components/schemas/TipoUsuario'
        tipo_verificado:
          type: boolean
          description: false muestra "Tipo declarado por el usuario" (FS-USR-06 RN-12).
        monitor:
          $ref: '#/components/schemas/Monitor'
        relacion:
          $ref: '#/components/schemas/Relacion'
        espera_hasta:
          type:
          - string
          - 'null'
          format: date
          description: Fecha desde la que puede volver a enviar solicitud tras un rechazo (MSG-05).
        numero_conexiones:
          type: integer
          minimum: 0
        retirado_por_moderacion:
          type: boolean
        titular:
          type:
          - string
          - 'null'
        biografia:
          type:
          - string
          - 'null'
        habilidades:
          type: array
          items:
            $ref: '#/components/schemas/Etiqueta'
        intereses:
          type: array
          items:
            $ref: '#/components/schemas/Etiqueta'
        puede_aportar:
          type: array
          items:
            $ref: '#/components/schemas/Etiqueta'
        necesita:
          type: array
          items:
            $ref: '#/components/schemas/Etiqueta'
        experiencia:
          type: array
          items:
            $ref: '#/components/schemas/EntradaExperiencia'
        proyectos:
          type: array
          items:
            $ref: '#/components/schemas/EntradaProyecto'
        logros:
          type: array
          items:
            $ref: '#/components/schemas/EntradaLogro'
  responses:
    Validacion:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Sin sesión o sesión vencida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: El actor no tiene permiso según "Quién es quién" (RNF-SEG-04).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe o el usuario no puede verlo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Estado cambiado, versión desactualizada o regla de negocio incumplida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LimiteDeUso:
      description: Límite de uso superado (RNF-SEG-07).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos para reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
