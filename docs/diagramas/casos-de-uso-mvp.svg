<text x="832" y="832" font-size="12" font-weight="700" fill="#1f2937">Cómo leerlo</text>
<text x="832" y="852" font-size="11" fill="#6b7280">Línea continua: el actor participa en el caso de uso.</text>
<text x="832" y="869" font-size="11" fill="#6b7280">Flecha con triángulo: generalización (hereda los</text>
<text x="832" y="886" font-size="11" fill="#6b7280">casos de uso del actor al que apunta).</text>
<text x="832" y="903" font-size="11" fill="#6b7280">Miembro de la comunidad (cursiva) es abstracto: agrupa</text>
<text x="832" y="920" font-size="11" fill="#6b7280">lo común a Estudiante, Profesor y Personal de Bienestar.</text>
<text x="832" y="937" font-size="11" fill="#6b7280">El Monitor es un Estudiante: solo agrega datos extra</text>
<text x="832" y="954" font-size="11" fill="#6b7280">a su perfil (CU-04); sus datos oficiales llegan por CU-31.</text>
<text x="832" y="971" font-size="11" fill="#6b7280">Ayudantías y monitorías se postulan fuera de UniLink.</text>
